name: Pages

# Builds the example site (navigation shell + every web example) and deploys it with GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions". No gh-pages branch involved.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2 # keep in sync with package.json "packageManager"
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - run: bun run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
